<!doctype html>
<html>
<head>
    <title>CSS'e Giriş</title>
    <style>
        .stilA {
            color: #FF0000;
            font-family: 'Courier New', Courier, monospace;
        }

        .stilB {
            font-size: xx-large;
            text-align: center;
        }

    </style>
</head>
<body>

    <div class="stilA">
        stilA sınıflı div
    </div>

    <div class="stilB">
        stilB sınıflı div
    </div>

    <div class="stilA stilB">
        Hem stilA hem de stilB sınıflı div
    </div>

</body>
</html>
