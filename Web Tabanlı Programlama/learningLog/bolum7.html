<html>
  <body>
    <script type="text/javascript">
      var kod = prompt("Lütfen 3 haneli bir kod giriniz:");

      if (kod === "112") {
        document.write("<h2 style='color:red'>🚨 Acil Alarm! Ambulans gönderiliyor...</h2>");
      } else if (kod === "155") {
        document.write("<h2 style='color:blue'>👮 Polis çağrıldı!</h2>");
      } else if (kod === "110") {
        document.write("<h2 style='color:orange'>🔥 İtfaiye yolda!</h2>");
      } else {
        document.write("<h2 style='color:green'>✅ Normal durum, yardım gerekmez.</h2>");
      }
    </script>
  </body>
</html>
