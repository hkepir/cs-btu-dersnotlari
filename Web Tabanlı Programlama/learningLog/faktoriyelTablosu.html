<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faktöriyel ve Çarpım Tablosu</title>
</head>
<body>
  <h1>Çarpım Tablosu ve Faktöriyel</h1>

  <!-- Çarpım Tablosu -->
  <h2>Çarpım Tablosu</h2>
  <table border="1" id="carpimTablosu"></table>

  <!-- Faktöriyel Tablosu -->
  <h2>Faktöriyel Tablosu</h2>
  <table border="1" id="faktoriyelTablosu">
    <tr><th>Sayı</th><th>Faktöriyeli</th></tr>
  </table>

  <script>
    // Çarpım tablosu oluşturma
    var carpimTablosu = document.getElementById("carpimTablosu");
    for (var i = 1; i <= 30; i++) {
      var row = "<tr>";
      for (var j = 1; j <= 30; j++) {
        row += "<td>" + (i * j) + "</td>";
      }
      row += "</tr>";
      carpimTablosu.innerHTML += row;
    }

    // Faktöriyel fonksiyonları
    function fact(a) {
      var carpim = 1;
      for (var i = 1; i <= a; i++) {
        carpim *= i;
      }
      return carpim;
    }

    function fact_recursive(a) {
      if (a === 0) return 1;
      return a * fact_recursive(a - 1);
    }

    // Faktöriyel tablosu oluşturma
    var faktoriyelTablosu = document.getElementById("faktoriyelTablosu");
    for (var i = 1; i <= 7; i++) {
      var row = "<tr><td>" + i + "</td><td>" + fact(i) + "</td></tr>";
      faktoriyelTablosu.innerHTML += row;
    }
  </script>
</body>
</html>
