<!doctype html>
<html>
<head>
    <title>CSS'e Giriş</title>
    <style>
        p {
            color: #FF0000;
        }
    </style>
</head>
<body>
    <p>CSS ile biçimlendirilmiş paragraf örneği.</p>
    <div>CSS kodu sadece p etiketi için belirtilmiş olduğundan burası varsayılan biçimde kalır.</div>
    <p>Bu paragraf da aynı biçime sahip.</p>
</body>
</html>
