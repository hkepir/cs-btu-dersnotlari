<html>
<head>
    <title>Kayıt Formu</title>
</head>
<body>

<h2>Kayıt Formu</h2>

<form action="kayit_yap.html" method="get">
    <br>Ad :
        <input type="text" name="ad">
    </br>

    <br>E-posta :
    <input type="e-posta" name="e-posta">
    </br>

    <br>Sifre
    <input type="password" name="sifre">
    </br>


    <br>Yas: 
        <input type="number" name="yas">
    </br>

    <br>
        <input type="radio" name="cinsiyet" value="erkek"> Erkek
        <input type="radio" name="cinsiyet" value="kadin"> Kadın
    </br>

    <br>Bolum Seciniz:
    <select name="bolum">
        <option>Bilgisayar Mühendisliği</option>
        <option>Makine Mühendisliği</option>
        <option>Mimarlik</option>
    </select>
    </br>

    <br>Hobi Seciniz:
        <input type="checkbox" name="hobi" value="spor"> Spor
        <input type="checkbox" name="hobi" value="muzik"> Müzik
    </br>

    <input type="submit" value="Kayıt Ol">

</form>

</body>
</html>
